<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Notes</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <header>
      <p class="small-title">MY LITTLE NOTEBOOK</p>
      <h1>Notes</h1>
      <p class="intro">A simple place for thoughts, reminders, and ideas.</p>
    </header>

    <section class="editor">
      <h2 id="form-title">Write a note</h2>
      <form id="note-form">
        <input type="hidden" id="note-id">
        <label for="title">Title</label>
        <input id="title" type="text" placeholder="Give your note a title" required>
        <label for="body">Note</label>
        <textarea id="body" rows="9" placeholder="Start writing here..." required></textarea>
        <div class="form-buttons">
          <button type="submit" class="save-button">Save note</button>
          <button type="button" id="cancel-button" class="text-button hidden">Cancel edit</button>
        </div>
      </form>
      <p id="message" class="message"></p>
    </section>

    <section class="notes-section">
      <div class="notes-heading">
        <h2>Saved notes</h2>
        <span id="note-count"></span>
      </div>
      <div id="notes-list" class="notes-list"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
